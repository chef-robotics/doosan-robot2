-
  ros1_package_name: 'dsr_msgs'
  ros2_package_name: 'dsr_msgs2'
-
  ros1_package_name: 'dsr_msgs'
  ros1_message_name: 'RobotState'
  ros2_package_name: 'dsr_msgs2'
  ros2_message_name: 'RobotState'
  fields_1_to_2:
    robot_state: 'robot_state'
    robot_state_str: 'robot_state_str'
    actual_mode: 'actual_mode'
    actual_space: 'actual_space'
    current_posj: 'current_posj'
    current_velj: 'current_velj'
    joint_abs: 'joint_abs'
    joint_err: 'joint_err'
    target_posj: 'target_posj'
    target_velj: 'target_velj'
    current_posx: 'current_posx'
    current_tool_posx: 'current_tool_posx'
    current_velx: 'current_velx'
    task_err: 'task_err'
    target_velx: 'target_velx'
    target_posx: 'target_posx'
    dynamic_tor: 'dynamic_tor'
    actual_jts: 'actual_jts'
    actual_ejt: 'actual_ejt'
    actual_ett: 'actual_ett'
    actual_bk: 'actual_bk'
    actual_mc: 'actual_mc'
    actual_mt: 'actual_mt'
    solution_space: 'solution_space'
    sync_time: 'sync_time'
    actual_bt: 'actual_bt'
    ctrlbox_digital_input: 'ctrlbox_digital_input'
    ctrlbox_digital_output: 'ctrlbox_digital_output'
    flange_digital_input: 'flange_digital_input'
    flange_digital_output: 'flange_digital_output'
    access_control: 'access_control'
    homming_completed: 'homming_completed'
    tp_initialized: 'tp_initialized'
    mastering_need: 'mastering_need'
    drl_stopped: 'drl_stopped'
    disconnected: 'disconnected'
    fActualW2B: 'f_actual_w2b'
    fCurrentVelW: 'f_current_vel_world'
    fWorldETT: 'f_world_ext_target_torque'
    fTargetPosW: 'f_target_pos_world'
    fTargetVelW: 'f_target_vel_world'
    fCurrentVelU: 'f_current_vel_user'
    fUserETT: 'f_user_ext_task_torque'
    fTargetPosU: 'f_target_pos_user'
    fTargetVelU: 'f_target_vel_user'
    iActualUCN: 'i_actual_user_coord_num'
    iParent: 'i_coord_ref'
    bActualSW: 'b_actual_switch_input'
    bActualSI: 'b_actual_safety_input'
    fActualAI: 'i_actual_analog_input_type'
    iActualAT: 'i_actual_analog_input_type'
    fTargetAO: 'i_target_analog_output_type'
    iTargetAT: 'i_target_analog_output_type'
    bActualES: 'b_actual_encorder_strove_signal'
    iActualED: 'i_actual_encorder_raw_data'
    bActualER: 'b_actual_encorder_reset_signal'
    fCurrentPosW: 'f_current_pos_world'
    fCurrentPosU: 'f_current_pos_user'
    fRotationMatrixWorld: 'f_rotation_matrix_world'
    fRotationMatrixUser: 'f_rotation_matrix_user'

-
# FollowJointTrajectory in ros2 had multi dof stuff added to it.  Map the things that are similar.
# Unmapped fields will be ignored
    enable_foreign_mappings: true
    ros1_package_name: 'control_msgs'
    ros1_action_name: 'FollowJointTrajectory'
    ros2_package_name: 'control_msgs' 
    ros2_action_name: 'FollowJointTrajectory'
    goal_fields_1_to_2:
        trajectory: 'trajectory'
        path_tolerance: 'path_tolerance'
        goal_tolerance: 'goal_tolerance'
        goal_time_tolerance: 'goal_time_tolerance'
    result_fields_1_to_2:
        error_code: 'error_code'
        error_string: 'error_string'
    feedback_fields_1_to_2:
        header: 'header'
        joint_names: 'joint_names'
        desired: 'desired'
        actual: 'actual'
        error: 'error'
-
    allow_missing: true
    enable_foreign_mappings: true
    ros1_package_name: 'controller_manager_msgs'
    ros1_message_name: 'ControllerState'
    ros2_package_name: 'controller_manager_msgs' 
    ros2_message_name: 'ControllerState'
    fields_1_to_2:
      name: 'name'
      state: state
      type: type
-
    allow_missing: true
    enable_foreign_mappings: true
    ros1_package_name: 'controller_manager_msgs'
    ros1_service_name: 'SwitchController'
    ros2_package_name: 'controller_manager_msgs' 
    ros2_service_name: 'SwitchController'
    request_fields_1_to_2:
      start_controllers: activate_controllers
      stop_controllers: deactivate_controllers
      start_asap: activate_asap
      timeout: timeout
    response_fields_1_to_2:
      ok: ok